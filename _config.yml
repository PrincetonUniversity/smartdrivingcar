title: SmartDrivingCar
description: The latest news in mobility and autonomy
# Base (production/local) config keeps baseurl empty so links are root-relative under custom domain or local dev.
baseurl: "" # empty for prod & local
url: "https://smartdrivingcar.com" # production custom domain (overridden in preview & local as needed)
permalink: pretty
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
collections:
  pages:
    output: true
  newsletters:
    output: true
    permalink: /newsletter/:year/:month/:day/:slug/
defaults:
  - scope:
      path: ""
      type: "newsletters"
    values:
      layout: newsletter
sass:
  style: compressed
exclude:
  - node_modules
  - Gemfile*
  - vendor
  - scripts
  - azure
  - config
  - docs
  - example-email
  - import
  - inbox
  - logs
  - pipeline
  - tests
  - .venv
  - .pytest_cache
  - .ruff_cache
  - .mypy_cache
  - requirements*.txt
  - requirements*.lock
  - pyproject.toml
  - docker-compose.yml
  - Dockerfile*
  - Makefile
  - example.env
  - pipeline-result.json
  - SHARED_TASK_NOTES.md
  - README.md
