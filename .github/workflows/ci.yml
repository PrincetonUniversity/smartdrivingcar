name: Pipeline tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build locked test container
        run: docker build --target tests -f Dockerfile.pipeline -t newsletter-tests .
      - name: Lint, format, type check and test without network access
        run: docker run --rm --network none --read-only --tmpfs /tmp -e MYPY_CACHE_DIR=/tmp/mypy -e RUFF_CACHE_DIR=/tmp/ruff newsletter-tests
      - name: Validate reproducible Azure templates
        run: |
          az bicep install --version v0.43.8
          az bicep build --file azure/connector/main.bicep --outfile /tmp/sdc-connector.json
          az bicep build --file azure/connector/foundation.bicep --outfile /tmp/sdc-foundation.json
