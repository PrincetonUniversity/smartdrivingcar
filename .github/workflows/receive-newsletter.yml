name: Receive Newsletter

on:
  repository_dispatch:
    types: [newsletter-processed]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  receive:
    # Legacy dispatch stays opt-in after the read-only reconciler is commissioned.
    if: vars.NEWSLETTER_LEGACY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      issues: ${{ steps.commit.outputs.issues }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.9'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Validate dispatch as data
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: .venv/bin/python scripts/publish_newsletter.py --dispatch
      - name: Commit validated newsletter
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- _newsletters/ newsletter/
          if ! git diff --staged --quiet; then
            git commit -m 'Publish validated newsletter'
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('pipeline-result.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('issues=' + json.dumps(report['issues']) + '\n')
          PY
  publish:
    needs: receive
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      revision: ${{ needs.receive.outputs.revision }}
      issues: ${{ needs.receive.outputs.issues }}
