name: Deploy verified site

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      issues:
        type: string
        default: '[]'
    # Only for the broken-link warning email; absent means no email is sent.
    secrets:
      RESEND_API_KEY:
        required: false
      RESEND_FROM:
        required: false
      RESEND_TO:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - name: Install locked verifier dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config_prod.yml
      - name: Verify every newsletter presentation and preserve archive routes
        run: .venv/bin/python scripts/restyle_archive.py --check-site _site --repair-routes
      - name: Repair or report links to this site inside newsletters
        # Never blocks publishing: unambiguous targets get a redirect page in
        # _site; anything else is reported, and lychee is told to skip it.
        run: >-
          .venv/bin/python scripts/newsletter_links.py _site
          --report "$RUNNER_TEMP/link-report.json" --lychee-ignore .lycheeignore
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --format detailed --offline --root-dir ./_site ./_site
          fail: true
      - name: Check public artifact and archive navigation
        run: .venv/bin/python scripts/check_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public issue identity and content fingerprint
        env:
          ISSUE_SLUGS: ${{ inputs.issues }}
          NEWSLETTER_PUBLIC_URL: ${{ vars.NEWSLETTER_PUBLIC_URL }}
        run: |
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          Path('pipeline-result.json').write_text(json.dumps({'issues': json.loads(os.environ['ISSUE_SLUGS'])}))
          PY
          .venv/bin/python scripts/verify_publication.py
      - name: Warn operators about broken newsletter links
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
        run: .venv/bin/python scripts/pipeline_observe.py warning --report "$RUNNER_TEMP/link-report.json"
