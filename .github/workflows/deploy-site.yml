name: Deploy verified site

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      issues:
        type: string
        default: '[]'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.3.10'
          bundler-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.9'
      - name: Install locked verifier dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config_prod.yml
      - name: Verify every newsletter presentation and preserve archive routes
        run: .venv/bin/python scripts/restyle_archive.py --check-site _site --repair-routes
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --format detailed --offline --root-dir ./_site ./_site
          fail: true
      - name: Check public artifact and archive navigation
        run: .venv/bin/python scripts/check_site.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public issue identity and content fingerprint
        env:
          ISSUE_SLUGS: ${{ inputs.issues }}
          NEWSLETTER_PUBLIC_URL: ${{ vars.NEWSLETTER_PUBLIC_URL }}
        run: |
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          Path('pipeline-result.json').write_text(json.dumps({'issues': json.loads(os.environ['ISSUE_SLUGS'])}))
          PY
          .venv/bin/python scripts/verify_publication.py
