name: Build and Deploy Site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'inbox/*.eml'
      - 'inbox/*.html'
      - 'import/*.eml'
      - 'import/*.html'
  workflow_dispatch:

# All publishing entry points use the same lock; writers checkout current main.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: quality
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      revision: main
